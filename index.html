<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume | Kumar Satya Sri Ram</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      max-width: 1000px;
      margin: 0 auto 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    a { color: white; }
    iframe {
      display: block;
      width: 100%;
      max-width: 1000px;
      height: calc(100vh - 110px);
      margin: auto;
      border: 1px solid #444;
      border-radius: 8px;
      background: white;
    }
  </style>
</head>
<body>
  <header>
    <span>Kumar Satya Sri Ram</span>
    <a id="download" href="#" download>Download Resume</a>
  </header>

  <iframe id="viewer" title="Resume"></iframe>

  <script>
    async function loadResume() {
      const response = await fetch(
        `latest.json?t=${Date.now()}`,
        { cache: "no-store" }
      );

      if (!response.ok) {
        throw new Error("Could not load latest resume");
      }

      const data = await response.json();
      if (!data.file || !data.version) {
        throw new Error("Invalid resume manifest");
      }

      const pdfUrl =
        `${data.file}?v=${encodeURIComponent(data.version)}`;

      document.getElementById("viewer").src = pdfUrl;
      document.getElementById("download").href = pdfUrl;
    }

    loadResume().catch(error => {
      document.body.innerHTML =
        "<h2>Unable to load resume. Please try again later.</h2>";
      console.error(error);
    });
  </script>
</body>
</html>
