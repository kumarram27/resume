
name: Build and Deploy Resume

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: resume-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout resume repository
        uses: actions/checkout@v5

      - name: Prepare website
        run: |
          mkdir -p public
          cp index.html public/index.html

      - name: Generate resume PDF
        id: resume
        uses: kumarram27/resume-forge@main
        with:
          resume_file: README.md
          output_dir: public
          template: modern
          accent_color: '#2563eb'
          font: inter
          versioning: 'true'
          commit_output: 'false'

      - name: Write latest resume manifest
        env:
          RESUME_VERSION: ${{ steps.resume.outputs.version }}
        run: |
          if [ -z "$RESUME_VERSION" ]; then
            echo "::error::ResumeForge did not return a versioned PDF filename."
            exit 1
          fi

          export RESUME_UPDATED_AT="$(git show -s --format=%cI "$GITHUB_SHA")"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["RESUME_VERSION"]
          if Path(version).name != version:
              raise SystemExit("ResumeForge returned an invalid versioned filename.")

          manifest = {
              "version": version,
              "file": f"versions/{version}",
              "updated_at": os.environ["RESUME_UPDATED_AT"],
          }
          Path("public/latest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5