name: Build and Deploy Resume

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout resume repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: resume.tex
          latexmk_use_xelatex: false

      - name: Verify PDF
        run: |
          test -f resume.pdf
          echo "Resume PDF generated successfully"

      - name: Clone portfolio repository
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/kumarram27/kumarram27.github.io.git portfolio

      - name: Update Resume.pdf
        run: |
          cp resume.pdf portfolio/public/Resume.pdf

      - name: Commit and push updated resume
        working-directory: portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/Resume.pdf

          if git diff --cached --quiet; then
            echo "No changes to Resume.pdf"
            exit 0
          fi

          git commit -m "chore: update resume"
          git push